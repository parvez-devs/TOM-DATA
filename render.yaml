services:
  - type: web
    name: tom-cookie-hub
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python -m unittest discover -s tests -v
    startCommand: gunicorn "cookie_hub.app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --threads 4 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: HUB_ADMIN_TOKEN
        generateValue: true
      - key: HUB_CLIENT_TOKEN
        generateValue: true
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tom-cookie-hub-db
          property: connectionString
databases:
  - name: tom-cookie-hub-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []
