name: Cookie hub checks
on:
  push:
    branches: [main, "axiom/**"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt PyYAML jsonschema
      - run: python -m compileall -q cookie_hub hub_client.py run_dump.py tests
      - run: python -m unittest discover -s tests -v
      - name: Validate Render schema
        run: |
          python - <<'PY'
          import json, urllib.request
          import jsonschema, yaml
          with urllib.request.urlopen("https://render.com/schema/render.yaml.json", timeout=30) as response:
              schema = json.load(response)
          with open("render.yaml") as handle:
              jsonschema.validate(yaml.safe_load(handle), schema)
          print("Render schema validated")
          PY
